<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #242424;
            --bg-card: #2d2d2d;
            --bg-card-hover: #353535;
            --text-primary: #e0e0e0;
            --text-secondary: #b0b0b0;
            --accent-gold: #d4a843;
            --accent-gold-light: #f0c860;
            --accent-gold-dark: #b8922e;
            --border-color: #3a3a3a;
            --shadow-color: rgba(0, 0, 0, 0.4);
            --glow-color: rgba(212, 168, 67, 0.15);
            --pulse-color: rgba(212, 168, 67, 0.3);
            /* 卡牌配色 新增U卡 */
            --sss-card: linear-gradient(145deg,#fff,#ffdd99);
            --ss-card: linear-gradient(145deg,#ffd700,#ff2266);
            --s-card: linear-gradient(145deg,#ffd700,#ff9500);
            --u-card: linear-gradient(145deg,#39e8e0,#20b8b0);
            --a-card: linear-gradient(145deg,#b066ff,#6038ff);
            --b-card: linear-gradient(145deg,#48d1ff,#0088cc);
            --c-card: linear-gradient(145deg,#60e888,#289648);
            --d-card: linear-gradient(145deg,#999,#666);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-primary);
            background-image:
                radial-gradient(ellipse at 50% 30%, rgba(60, 60, 60, 0.3) 0%, transparent 70%),
                radial-gradient(ellipse at 80% 70%, rgba(50, 50, 50, 0.2) 0%, transparent 60%),
                radial-gradient(ellipse at 20% 60%, rgba(40, 40, 40, 0.25) 0%, transparent 55%);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }
        /* 功能按钮通用 */
        .shop-btn, .gacha-btn, .bag-btn {
            position: fixed;
            padding: 8px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            z-index: 99;
            transition: all 0.3s ease;
            border: 1px solid;
            background: var(--bg-card);
        }
        /* 商城按钮 左上角 */
        .shop-btn {
            top: 20px;
            left: 20px;
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }
        .shop-btn:hover {
            background: var(--accent-gold);
            color: #111;
        }
        /* 抽卡按钮 右上角 */
        .gacha-btn {
            top: 20px;
            right: 20px;
            border-color: #ff88aa;
            color: #ffb8cc;
        }
        .gacha-btn:hover {
            background: #ff88aa;
            color: #111;
        }
        /* 背包按钮 左下角 */
        .bag-btn {
            bottom: 20px;
            left: 20px;
            border-color: #88ccff;
            color: #aaddff;
        }
        .bag-btn:hover {
            background: #88ccff;
            color: #111;
        }
        /* 弹窗遮罩通用 */
        .mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        .mask.show {
            display: flex;
        }
        /* 商城面板 */
        .shop-panel {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            min-width: 320px;
        }
        .shop-title {
            color: var(--accent-gold);
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .speed-tip {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.8rem;
            margin-bottom: 15px;
        }
        .shop-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .shop-item:last-child {
            border-bottom: none;
        }
        .buy-btn {
            padding: 5px 12px;
            background: var(--accent-gold);
            color: #111;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }
        .buy-btn:hover {
            opacity: 0.85;
        }
        .close-btn {
            margin-top: 20px;
            width: 100%;
            padding: 8px;
            background: var(--bg-card);
            border: 1px solid var(--text-secondary);
            color: var(--text-secondary);
            border-radius: 8px;
            cursor: pointer;
        }
        /* ========== 全新美化抽卡面板 ========== */
        .gacha-panel {
            background: linear-gradient(160deg, #1c1428, #291c3d);
            border: 1px solid #7a4999;
            border-radius: 20px;
            padding: 32px 28px;
            width: min(92vw, 620px);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(180, 100, 220, 0.25);
        }
        /* 抽卡面板背景光晕 */
        .gacha-panel::before {
            content: "";
            position: absolute;
            top: -120px;
            left: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255,130,180,0.18) 0%, transparent 70%);
            z-index: 0;
        }
        .gacha-panel::after {
            content: "";
            position: absolute;
            bottom: -100px;
            right: -80px;
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(190,120,255,0.12) 0%, transparent 70%);
            z-index: 0;
        }
        .gacha-panel > * {
            position: relative;
            z-index: 1;
        }
        .gacha-title {
            color: #ffd2e0;
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 14px;
            letter-spacing: 4px;
            text-shadow: 0 0 12px rgba(255,140,180,0.6);
            font-weight: 600;
        }
        .gacha-cost-tip {
            text-align: center;
            color: #d0b8e6;
            font-size: 0.82rem;
            line-height: 1.6;
            margin-bottom: 24px;
            padding: 10px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        /* 卡牌容器 */
        .card-row {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin: 26px 0;
            min-height: 140px;
            align-items: center;
        }
        /* 抽卡单张卡牌样式+动画 */
        .card-item {
            width: 120px;
            height: 140px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            transform: scale(0.7);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.2,0.8,0.2,1);
            position: relative;
            overflow: hidden;
        }
        /* 卡牌展示激活动画 */
        .card-item.show {
            transform: scale(1);
            opacity: 1;
        }
        /* SSS/SS/U流光特效 */
        .card-SSS::before, .card-SS::before, .card-U::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 100%;
            top: 0;
            left: -100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: cardShine 2.2s infinite linear;
        }
        @keyframes cardShine {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        .empty-card {
            background: rgba(40,40,40,0.6);
            border: 2px dashed #666;
            color: #777;
            transform: scale(1);
            opacity: 1;
        }
        /* 抽卡操作按钮区 */
        .gacha-operate {
            display: flex;
            gap: 14px;
            margin-top: 16px;
        }
        .gacha-draw {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff6b9b, #ff4078);
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            box-shadow: 0 0 18px rgba(255,80,130,0.35);
            transition: all 0.25s ease;
        }
        .gacha-draw:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 24px rgba(255,80,130,0.5);
        }
        .gacha-draw:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .sell-all {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #555, #333);
            color: #fff;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.25s ease;
        }
        .sell-all:hover {
            background: linear-gradient(135deg, #666, #444);
        }
        /* 背包面板 MC风格 多行 */
        .bag-panel {
            background: #222222;
            border: 4px solid #555555;
            border-radius: 4px;
            padding: 20px;
            min-width: unset;
            width: min(94vw, 680px);
            max-height: 85vh;
            overflow-y: auto;
        }
        .bag-title {
            color: #aaddff;
            text-align: center;
            font-size: 1.2rem;
            margin-bottom: 16px;
            letter-spacing: 2px;
        }
        /* MC背包网格 9列自动多行 */
        .bag-grid {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 6px;
            margin-bottom: 15px;
        }
        /* MC物品槽 */
        .mc-slot {
            width: 56px;
            height: 56px;
            background: #333333;
            border: 2px solid #666666;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-size: 22px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 1px 3px #000;
        }
        .mc-slot.empty {
            background: #2b2b2b;
            border-color: #444;
        }
        /* 堆叠数量自适应缩小 */
        .stack-count {
            position: absolute;
            right: 4px;
            bottom: 2px;
            font-family: "Microsoft YaHei", monospace;
            color: #ffffff;
            text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
        }
        .stack-count.small { font-size: 11px; }
        .stack-count.normal { font-size: 14px; }
        .bag-total-text {
            text-align: right;
            color: #ffb8cc;
            font-size: clamp(0.75rem, 2vw, 0.95rem);
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        /* 卡牌等级样式 新增U */
        .card-SSS { background: var(--sss-card); color:#111; }
        .card-SS { background: var(--ss-card); }
        .card-S { background: var(--s-card); }
        .card-U { background: var(--u-card); }
        .card-A { background: var(--a-card); }
        .card-B { background: var(--b-card); }
        .card-C { background: var(--c-card); }
        .card-D { background: var(--d-card); }
        /* 背景装饰粒子 */
        .bg-particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            background: var(--accent-gold);
            opacity: 0;
            animation: floatUp 8s infinite ease-in;
        }
        .particle:nth-child(1) {
            width: 3px;
            height: 3px;
            left: 15%;
            bottom: -10px;
            animation-delay: 0s;
            animation-duration: 7s;
        }
        .particle:nth-child(2) {
            width: 2px;
            height: 2px;
            left: 30%;
            bottom: -10px;
            animation-delay: 2s;
            animation-duration: 9s;
        }
        .particle:nth-child(3) {
            width: 4px;
            height: 4px;
            left: 50%;
            bottom: -10px;
            animation-delay: 4s;
            animation-duration: 7.5s;
        }
        .particle:nth-child(4) {
            width: 2.5px;
            height: 2.5px;
            left: 68%;
            bottom: -10px;
            animation-delay: 1.5s;
            animation-duration: 8.5s;
        }
        .particle:nth-child(5) {
            width: 3.5px;
            height: 3.5px;
            left: 82%;
            bottom: -10px;
            animation-delay: 5s;
            animation-duration: 6.8s;
        }
        .particle:nth-child(6) {
            width: 2px;
            height: 2px;
            left: 22%;
            bottom: -10px;
            animation-delay: 3.5s;
            animation-duration: 9.5s;
        }
        .particle:nth-child(7) {
            width: 3px;
            height: 3px;
            left: 75%;
            bottom: -10px;
            animation-delay: 6s;
            animation-duration: 7.2s;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            5% {
                opacity: 0.7;
            }
            30% {
                opacity: 0.5;
                transform: translateY(-35vh) translateX(15px) scale(1.3);
            }
            60% {
                opacity: 0.2;
                transform: translateY(-65vh) translateX(-10px) scale(0.8);
            }
            100% {
                transform: translateY(-100vh) translateX(25px) scale(0.3);
                opacity: 0;
            }
        }
        /* 主容器 */
        .main-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        /* 标题 */
        .title-section {
            text-align: center;
        }
        .title-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 300;
        }
        .title-sub {
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: #777;
            font-weight: 300;
        }
        .slogan {
            font-size: 1rem;
            color: var(--accent-gold);
            text-decoration: underline;
            letter-spacing: 2px;
            margin-top: 8px;
        }
        /* 金钱卡片 */
        .money-card {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 50px 55px 45px;
            box-shadow:
                0 20px 60px var(--shadow-color),
                0 4px 16px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1.2);
            cursor: default;
            min-width: 360px;
            text-align: center;
        }
        .money-card:hover {
            box-shadow:
                0 28px 70px var(--shadow-color),
                0 6px 22px rgba(0, 0, 0, 0.4),
                0 0 80px var(--glow-color),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
            transform: translateY(-4px);
            border-color: #4a4a4a;
        }
        /* 卡片顶部装饰线 */
        .card-accent-line {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
            border-radius: 0 0 3px 3;
            transition: width 0.4s ease;
        }
        .money-card:hover .card-accent-line {
            width: 100px;
        }
        /* 图标容器 */
        .icon-wrapper {
            position: relative;
            display: inline-block;
            margin-bottom: 16px;
        }
        .coin-icon {
            width: 56px;
            height: 56px;
            position: relative;
            z-index: 1;
            filter: drop-shadow(0 4px 12px rgba(180, 150, 60, 0.5));
            animation: gentleBob 4s ease-in-out infinite;
        }
        @keyframes gentleBob {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        .icon-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212, 168, 67, 0.25) 0%, transparent 70%);
            z-index: 0;
            animation: glowPulse 2.5s ease-in-out infinite;
        }
        @keyframes glowPulse {
            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.6;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0.15;
            }
        }
        /* 金额显示 */
        .money-amount {
            font-size: 4.2rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: 1px;
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 4px;
            transition: color 0.3s ease;
            font-variant-numeric: tabular-nums;
            font-family: 'SF Mono', 'JetBrains Mono', 'Consolas', 'PingFang SC', monospace;
        }
        .money-symbol {
            font-size: 2rem;
            color: var(--accent-gold);
            font-weight: 600;
            margin-right: 2px;
            align-self: flex-start;
            margin-top: 6px;
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
        }
        .money-integer {
            color: #f0f0f0;
            transition: all 0.15s ease;
        }
        .money-decimal {
            font-size: 2.4rem;
            color: #aaaaaa;
            font-weight: 400;
            transition: all 0.15s ease;
        }
        /* 金额变化时的闪烁效果 */
        .money-amount.pulse .money-integer {
            animation: numberPulse 0.4s ease-out;
        }
        .money-amount.pulse .money-decimal {
            animation: decimalPulse 0.4s ease-out;
        }
        @keyframes numberPulse {
            0% {
                color: var(--accent-gold-light);
                text-shadow: 0 0 30px rgba(240, 200, 96, 0.6);
            }
            100% {
                color: #f0f0f0;
                text-shadow: none;
            }
        }
        @keyframes decimalPulse {
            0% {
                color: var(--accent-gold-light);
                text-shadow: 0 0 20px rgba(240, 200, 96, 0.5);
            }
            100% {
                color: #aaaaaa;
                text-shadow: none;
            }
        }
        /* 速率标签 */
        .rate-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 10px 22px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .rate-badge:hover {
            border-color: #555;
            color: #ccc;
        }
        .rate-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #5cb85c;
            animation: dotBlink 1.5s ease-in-out infinite;
            box-shadow: 0 0 8px rgba(92, 184, 92, 0.5);
        }
        @keyframes dotBlink {
            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 8px rgba(92, 184, 92, 0.5);
            }
            50% {
                opacity: 0.3;
                box-shadow: 0 0 3px rgba(92, 184, 92, 0.2);
            }
        }
        /* 底部信息 */
        .info-text {
            font-size: 0.72rem;
            color: #555;
            letter-spacing: 2px;
            text-align: center;
            transition: color 0.3s ease;
        }
        /* 响应式移动端 */
        @media (max-width: 480px) {
            .money-card {
                min-width: auto;
                width: 90vw;
                padding: 35px 25px 32px;
                border-radius: 20px;
            }
            .money-amount {
                font-size: 3rem;
            }
            .money-decimal {
                font-size: 1.7rem;
            }
            .money-symbol {
                font-size: 1.5rem;
                margin-top: 4px;
            }
            .coin-icon {
                width: 42px;
                height: 42px;
            }
            .icon-glow {
                width: 54px;
                height: 54px;
            }
            .rate-badge {
                font-size: 0.75rem;
                padding: 8px 16px;
            }
            .title-label {
                font-size: 0.7rem;
                letter-spacing: 4px;
            }
            .slogan {
                font-size: 0.9rem;
            }
            .shop-panel {
                width: 92vw;
                min-width: unset;
            }
            .card-item {
                width: 90px;
                height: 110px;
                font-size: 28px;
            }
            .bag-panel {
                min-width: unset;
                width: 94vw;
            }
            .mc-slot {
                width: 42px;
                height: 42px;
                font-size: 16px;
            }
            .stack-count.normal { font-size: 10px; }
            .stack-count.small { font-size: 8px; }
        }
    </style>
</head>
<body>
    <!-- 商城按钮 左上角 -->
    <button class="shop-btn" id="openShop">商城</button>
    <!-- 抽卡按钮 右上角 -->
    <button class="gacha-btn" id="openGacha">抽卡</button>
    <!-- 背包按钮 左下角 -->
    <button class="bag-btn" id="openBag">背包</button>
    <!-- 商城弹窗 -->
    <div class="mask" id="shopMask">
        <div class="shop-panel">
            <div class="shop-title">加速商城</div>
            <div class="speed-tip">当前每秒增长：<span id="nowSpeed">0.1</span></div>
            <div class="shop-item">
                <span>花费 5元 → 每秒 +0.1</span>
                <button class="buy-btn" data-cost="5" data-add="0.1">购买</button>
            </div>
            <div class="shop-item">
                <span>花费 10元 → 每秒 +0.5</span>
                <button class="buy-btn" data-cost="10" data-add="0.5">购买</button>
            </div>
            <div class="shop-item">
                <span>花费 20元 → 每秒 +1</span>
                <button class="buy-btn" data-cost="20" data-add="1">购买</button>
            </div>
            <div class="shop-item">
                <span>花费 100元 → 每秒 +10</span>
                <button class="buy-btn" data-cost="100" data-add="10">购买</button>
            </div>
            <button class="close-btn" id="closeShop">关闭</button>
        </div>
    </div>
    <!-- 抽卡弹窗 -->
    <div class="mask" id="gachaMask">
        <div class="gacha-panel">
            <div class="gacha-title">梦幻卡牌卡包</div>
            <div class="gacha-cost-tip">一次卡包100元，内含3张卡牌
                <br>概率：SSS 0.5% | SS 1.5% | S 2% | U 2% | A 6% | B 15% | C 25% | D 48%
            </div>
            <div class="card-row" id="cardBox">
                <div class="card-item empty-card">-</div>
                <div class="card-item empty-card">-</div>
                <div class="card-item empty-card">-</div>
            </div>
            <div class="gacha-operate">
                <button class="gacha-draw" id="drawBtn">抽一次(100元)</button>
                <button class="sell-all" id="sellAllBtn">一键出售全部卡牌</button>
            </div>
            <button class="close-btn" id="closeGacha" style="margin-top:14px">关闭</button>
        </div>
    </div>
    <!-- 背包弹窗（MC网格堆叠多行） -->
    <div class="mask" id="bagMask">
        <div class="bag-panel">
            <div class="bag-title">卡牌背包</div>
            <div id="bagList"></div>
            <button class="close-btn" id="closeBag">关闭</button>
        </div>
    </div>
    <!-- 背景装饰粒子 -->
    <div class="bg-particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>
    <!-- 主容器 -->
    <div class="main-container">
        <!-- 标题 -->
        <div class="title-section">
            <div class="title-label">💰 资产累计</div>
            <div class="title-sub">AUTO ACCUMULATION</div>
            <div class="slogan">时间就是金钱</div>
        </div>
        <!-- 金钱卡片 -->
        <div class="money-card" id="moneyCard">
            <div class="card-accent-line"></div>
            <!-- 金币图标 -->
            <div class="icon-wrapper">
                <div class="icon-glow"></div>
                <svg class="coin-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#f7d86c"/>
                            <stop offset="30%" stop-color="#e8b840"/>
                            <stop offset="60%" stop-color="#d4a020"/>
                            <stop offset="100%" stop-color="#c89018"/>
                        </linearGradient>
                        <linearGradient id="coinShine" x1="30%" y1="10%" x2="70%" y2="90%">
                            <stop offset="0%" stop-color="rgba(255,255,255,0.5)"/>
                            <stop offset="40%" stop-color="rgba(255,255,255,0.1)"/>
                            <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
                        </linearGradient>
                    </defs>
                    <circle cx="32" cy="32" r="28" fill="url(#coinGrad)" stroke="#a07818" stroke-width="2.5"/>
                    <circle cx="32" cy="32" r="22" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
                    <circle cx="32" cy="32" r="28" fill="url(#coinShine)"/>
                    <text x="32" y="40" text-anchor="middle" font-size="26" font-weight="bold"
                    fill="#8b6914" font-family="serif">¥</text>
                </svg>
            </div>
            <!-- 金额 -->
            <div class="money-amount" id="moneyAmount">
                <span class="money-symbol">¥</span>
                <span class="money-integer" id="moneyInteger">0</span>
                <span class="money-decimal" id="moneyDecimal">.0</span>
            </div>
        </div>
        <!-- 速率指示 -->
        <div class="rate-badge" id="rateBadge">
            <span class="rate-dot"></span>
            <span>每秒 +0.1</span>
        </div>
        <!-- 底部信息 -->
        <div class="info-text" id="infoText">
            已运行 0 秒
        </div>
    </div>
    <script>
        (function() {
            // 缓存键
            const CACHE_TENTHS = 'money_total_tenths';
            const CACHE_SECONDS = 'money_elapsed_seconds';
            const CACHE_SPEED = 'money_add_speed';
            const CACHE_LAST_VISIBLE = 'money_last_visible_time';
            const CACHE_CARDS = 'gacha_card_list';
            // 初始数据 统一用整数十分位杜绝浮点误差
            let totalTenths = Number(localStorage.getItem(CACHE_TENTHS)) || 0;
            let elapsedSeconds = Number(localStorage.getItem(CACHE_SECONDS)) || 0;
            let addPerTick = Number(localStorage.getItem(CACHE_SPEED)) || 1; // 1=0.1元/秒
            let lastVisibleTs = Number(localStorage.getItem(CACHE_LAST_VISIBLE)) || Date.now();
            let cardBag = JSON.parse(localStorage.getItem(CACHE_CARDS)) || [];
            let isDrawing = false; // 抽卡动画锁定标记

            // DOM
            const moneyInteger = document.getElementById('moneyInteger');
            const moneyDecimal = document.getElementById('moneyDecimal');
            const moneyAmount = document.getElementById('moneyAmount');
            const infoText = document.getElementById('infoText');
            const moneyCard = document.getElementById('moneyCard');
            const rateBadge = document.getElementById('rateBadge');
            const nowSpeedDom = document.getElementById('nowSpeed');
            const openShop = document.getElementById('openShop');
            const closeShop = document.getElementById('closeShop');
            const shopMask = document.getElementById('shopMask');
            const buyBtns = document.querySelectorAll('.buy-btn');
            // 抽卡DOM
            const openGacha = document.getElementById('openGacha');
            const closeGacha = document.getElementById('closeGacha');
            const gachaMask = document.getElementById('gachaMask');
            const cardBox = document.getElementById('cardBox');
            const drawBtn = document.getElementById('drawBtn');
            const sellAllBtn = document.getElementById('sellAllBtn');
            const cardSlots = cardBox.querySelectorAll('.card-item');
            // 背包DOM
            const openBag = document.getElementById('openBag');
            const closeBag = document.getElementById('closeBag');
            const bagMask = document.getElementById('bagMask');
            const bagList = document.getElementById('bagList');
            let previousIntegerPart = 0;
            let previousDecimalDigit = 0;
            let intervalId = null;

            // 保存缓存
            function saveCache() {
                localStorage.setItem(CACHE_TENTHS, totalTenths);
                localStorage.setItem(CACHE_SECONDS, elapsedSeconds);
                localStorage.setItem(CACHE_SPEED, addPerTick);
                localStorage.setItem(CACHE_LAST_VISIBLE, Date.now());
                localStorage.setItem(CACHE_CARDS, JSON.stringify(cardBag));
            }
            // 更新速度显示
            function updateSpeedView() {
                const realSpeed = (addPerTick / 10).toFixed(1);
                rateBadge.innerHTML = `<span class="rate-dot"></span><span>每秒 +${realSpeed}</span>`;
                nowSpeedDom.textContent = realSpeed;
            }
            // 渲染页面金额
            function updateDisplay() {
                const integerPart = Math.floor(totalTenths / 10);
                const decimalDigit = totalTenths % 10;
                moneyInteger.textContent = integerPart.toLocaleString();
                moneyDecimal.textContent = '.' + decimalDigit;
                if (integerPart !== previousIntegerPart || decimalDigit !== previousDecimalDigit) {
                    moneyAmount.classList.remove('pulse');
                    void moneyAmount.offsetWidth;
                    moneyAmount.classList.add('pulse');
                    previousIntegerPart = integerPart;
                    previousDecimalDigit = decimalDigit;
                }
                infoText.textContent = '已运行 ' + elapsedSeconds + ' 秒';
            }
            // 计时主逻辑
            function tick() {
                totalTenths += addPerTick;
                elapsedSeconds += 1;
                updateDisplay();
                saveCache();
            }
            // 切后台补收益
            function calcOfflineTime() {
                const now = Date.now();
                const diffMs = now - lastVisibleTs;
                const offlineSec = Math.floor(diffMs / 1000);
                if (offlineSec > 1) {
                    totalTenths += addPerTick * offlineSec;
                    elapsedSeconds += offlineSec;
                }
                lastVisibleTs = now;
                saveCache();
            }
            // 抽卡随机卡牌 新增U卡概率
            function getRandomCard() {
                const r = Math.random() * 100;
                if(r < 0.5) return 'SSS';
                if(r < 2.0) return 'SS';
                if(r < 4.0) return 'S';
                if(r < 6.0) return 'U';
                if(r < 12.0) return 'A';
                if(r < 27.0) return 'B';
                if(r < 52.0) return 'C';
                return 'D';
            }
            // 重置卡槽为空白
            function resetCardSlots() {
                cardSlots.forEach(slot => {
                    slot.className = 'card-item empty-card';
                    slot.innerText = '-';
                });
            }
            // 逐张展示卡牌动画
            async function showCardsAnimate(cardList) {
                resetCardSlots();
                drawBtn.disabled = true;
                isDrawing = true;
                for(let i = 0; i < 3; i++) {
                    const grade = cardList[i];
                    const slot = cardSlots[i];
                    slot.className = `card-item card-${grade}`;
                    slot.innerText = grade;
                    // 触发入场动画
                    void slot.offsetWidth;
                    slot.classList.add('show');
                    await new Promise(res => setTimeout(res, 700));
                }
                // 全部展示完停留2秒，清空卡牌
                await new Promise(res => setTimeout(res, 2000));
                resetCardSlots();
                drawBtn.disabled = false;
                isDrawing = false;
            }
            // 单次抽卡逻辑
            function doDraw() {
                if(isDrawing) return;
                const cost = 1000;
                if(totalTenths < cost){
                    alert('余额不足100元，无法抽卡！');
                    return;
                }
                totalTenths -= cost;
                const newCards = [getRandomCard(), getRandomCard(), getRandomCard()];
                cardBag.push(...newCards);
                updateDisplay();
                saveCache();
                showCardsAnimate(newCards);
            }
            // 卡牌售价（十分位）新增U
            const sellPrice = {
                D:10, C:20, B:10, A:200, U:300, S:500, SS:1500, SSS:5000
            }
            const cardName = {
                D:"D", C:"C", B:"B", A:"A", U:"U", S:"S", SS:"SS", SSS:"SSS"
            }
            // 一键全部出售
            function sellAllCards() {
                if(cardBag.length === 0){
                    alert('仓库暂无卡牌');
                    return;
                }
                let totalGain = 0;
                cardBag.forEach(type=> totalGain += sellPrice[type]);
                totalTenths += totalGain;
                cardBag = [];
                resetCardSlots();
                updateDisplay();
                saveCache();
                alert(`全部卡牌出售完毕，获得 ${(totalGain/10).toFixed(1)} 元！`);
            }
            // ========== MC多行堆叠背包渲染 排序SSS>SS>S>U>A>B>C>D ==========
            function renderBag() {
                const stackMap = {SSS:0, SS:0, S:0, U:0, A:0, B:0, C:0, D:0};
                cardBag.forEach(t => stackMap[t]++);
                const order = ["SSS","SS","S","U","A","B","C","D"];
                let gridHtml = `<div class="bag-grid">`;
                // 填充有卡牌格子
                order.forEach(grade => {
                    const count = stackMap[grade];
                    if(count <= 0) return;
                    const sizeClass = count >= 1000 ? 'small' : 'normal';
                    gridHtml += `
                        <div class="mc-slot card-${grade}">
                            ${cardName[grade]}
                            <span class="stack-count ${sizeClass}">${count}</span>
                        </div>
                    `;
                })
                // 补齐空白格子（最多4行36格）
                const maxGrid = 36;
                const usedSlots = order.filter(g=>stackMap[g]>0).length;
                const emptySlots = maxGrid - usedSlots;
                for(let i=0;i<emptySlots;i++){
                    gridHtml += `<div class="mc-slot empty"></div>`;
                }
                gridHtml += `</div>`;
                // 计算总价
                let totalNum = cardBag.length;
                let totalValue = 0;
                Object.keys(stackMap).forEach(g=> totalValue += stackMap[g] * sellPrice[g]);
                gridHtml += `
                    <div class="bag-total-text">
                        卡牌总数：${totalNum} 张 | 全部出售总价：¥${(totalValue/10).toFixed(1)}
                    </div>
                `;
                bagList.innerHTML = gridHtml;
            }
            // 初始化
            function init() {
                calcOfflineTime();
                updateSpeedView();
                updateDisplay();
                intervalId = setInterval(tick, 1000);
            }
            // 弹窗事件
            openShop.addEventListener('click', () => shopMask.classList.add('show'));
            shopMask.addEventListener('click', e => e.target === shopMask && shopMask.classList.remove('show'));
            closeShop.addEventListener('click', () => shopMask.classList.remove('show'));

            openGacha.addEventListener('click', () => gachaMask.classList.add('show'));
            gachaMask.addEventListener('click', e => e.target === gachaMask && gachaMask.classList.remove('show'));
            closeGacha.addEventListener('click', () => gachaMask.classList.remove('show'));

            openBag.addEventListener('click', () => {
                renderBag();
                bagMask.classList.add('show');
            });
            bagMask.addEventListener('click', e => e.target === bagMask && bagMask.classList.remove('show'));
            closeBag.addEventListener('click', () => bagMask.classList.remove('show'));

            drawBtn.addEventListener('click', doDraw);
            sellAllBtn.addEventListener('click', sellAllCards);
            // 商城购买加速
            buyBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const cost = Number(btn.dataset.cost);
                    const addSpeed = Number(btn.dataset.add);
                    const costTenths = cost * 10;
                    const addTick = addSpeed * 10;
                    if (totalTenths >= costTenths) {
                        totalTenths -= costTenths;
                        addPerTick += addTick;
                        updateDisplay();
                        updateSpeedView();
                        saveCache();
                        alert(`购买成功！当前每秒增长 +${(addPerTick/10).toFixed(1)}`);
                    } else {
                        alert('余额不足，无法购买！');
                    }
                });
            });
            // 点击金额卡片查看精确数值
            moneyCard.addEventListener('click', function() {
                const exactYuan = totalTenths / 10;
                const originalTitle = document.querySelector('.title-label').textContent;
                const titleLabel = document.querySelector('.title-label');
                titleLabel.textContent = '💎 精确: ¥' + exactYuan.toFixed(1);
                titleLabel.style.color = '#d4a843';
                setTimeout(() => {
                    titleLabel.textContent = originalTitle;
                    titleLabel.style.color = '';
                }, 1800);
            });
            // 页面关闭保存数据
            window.addEventListener('beforeunload', () => {
                clearInterval(intervalId);
                saveCache();
            });
            // 切回页面更新离线收益
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible') {
                    calcOfflineTime();
                    updateDisplay();
                    updateSpeedView();
                }
            });
            init();
        })();
    </script>
</body>
</html>
